name: Shibu checks
on:
  push:
    branches: [shibu, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    # Native AppKit materials, shortcuts and allocation budgets belong to macOS.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install scanner for real Git-hook tests
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: |
          shibu_go=$(command -v go)
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH" "$shibu_go" test ./...
      - run: go tool mygo vet .
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check committed diff whitespace
        env:
          SHIBU_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$SHIBU_DIFF_BASE" in
            ""|0000000000000000000000000000000000000000)
              SHIBU_DIFF_BASE=$(git merge-base origin/shibu HEAD) ;;
          esac
          git diff --check "$SHIBU_DIFF_BASE" HEAD
          git diff --check
  linux-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install scanner for real Git-hook tests
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: |
          shibu_go=$(command -v go)
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH" "$shibu_go" test ./internal/...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
